<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Dashboard System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="main-header">
    <div class="header-content">
        <h1>🎓 CGPA Dashboard System</h1>
        <p>Modern Academic Performance Tracker</p>
    </div>
</header>

<!-- ================= STUDENT INFO ================= -->
<section class="student-info">
    <div class="info-card">
        <label>Student Name</label>
        <input type="text" id="studentName" placeholder="Enter student name">
    </div>

    <div class="info-card">
        <label>Roll Number</label>
        <input type="text" id="studentRoll" placeholder="Enter roll number">
    </div>
</section>


<div id="t1" class="tab-content active">
    <input id="semCount" type="number" placeholder="Semesters">
    <button onclick="generateSemesters()">Generate</button>
    <div id="semBox"></div>
    <button onclick="calcCGPA()">Calculate CGPA</button>
    <div id="out1"></div>
</div>

<!-- TAB 2 -->
<div id="t2" class="tab-content">
    <input id="courseCount" type="number" placeholder="Courses">
    <button onclick="generateCourses()">Generate</button>
    <div id="courseBox"></div>
    <button onclick="calcGPA()">Calculate GPA</button>
    <div id="out2"></div>
</div>

<!-- TAB 3 -->
<div id="t3" class="tab-content">
    <input id="gpaCount" type="number" placeholder="Semesters">
    <button onclick="generatePast()">Generate</button>
    <div id="pastBox"></div>
    <button onclick="calcPastCGPA()">Calculate CGPA</button>
    <div id="out3"></div>
</div>

<!-- ================= FOOTER ================= -->
<footer class="footer">
    <p>CGPA System developed by Hammad Younis Abbasi</p>
</footer>

<script src="script.js"></script>

</body>
</html>
