<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Dashboard System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="main-header">
    <div class="header-content">
        <h1>🎓 CGPA Dashboard System</h1>
        <p>Modern Academic Performance Tracker  </p>
    </div>
</header>

<!-- STUDENT INFO -->
<div class="student">
    <input id="studentName" placeholder="Student Name">
    <input id="studentRoll" placeholder="Roll Number">
</div>

<!-- ================= TAB 1 ================= -->
<h2>Detailed CGPA</h2>

<input type="number" id="totalSemesters" placeholder="Number of Semesters">
<button onclick="generateSemesters()">Generate Semesters</button>

<div id="semesterContainer"></div>

<button onclick="calculateCGPA()">Calculate CGPA</button>
<div id="output"></div>

<hr>

<!-- ================= TAB 2 ================= -->
<h2>Semester GPA</h2>

<input type="number" id="gpaCourseCount" placeholder="Number of Courses">
<button onclick="generateGPACourses()">Generate Courses</button>

<div id="gpaCourseContainer"></div>

<button onclick="calculateSemesterGPA()">Calculate GPA</button>
<div id="gpaOutput"></div>

<hr>

<!-- ================= TAB 3 ================= -->
<h2>CGPA from Previous GPA</h2>

<input type="number" id="knownSemesterCount" placeholder="Number of Semesters">
<button onclick="generateKnownSemesters()">Generate Table</button>

<div id="knownSemesterContainer"></div>

<button onclick="calculateKnownCGPA()">Calculate CGPA</button>
<div id="knownOutput"></div>

<footer class="footer">
    <p>CGPA System developed by Hammad Younis Abbasi</p>
</footer>

<script src="script.js"></script>
</body>
</html>
